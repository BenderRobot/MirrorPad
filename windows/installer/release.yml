# À chaque push sur main : compile l'app iPad sur SRVHOME, l'installe aussitôt sur l'iPad,
# emballe l'app Windows et le paquet Debian, et publie une release GitHub (récupérée toute seule par les PC).
name: Release bSideDesk

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  handshake-tests:
    name: Authentification iPad (tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Tester les transitions du protocole
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic ipad/tests/handshake.c -o /tmp/bsidedesk-handshake
          /tmp/bsidedesk-handshake
      - name: Tester le déploiement et la migration Debian
        run: python3 -m unittest discover -s tests -v

  ipad:
    name: iPad (SRVHOME)
    needs: handshake-tests
    runs-on: [self-hosted, Linux, X64]   # SRVHOME (seul runner auto-hébergé du dépôt)
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        env:
          MP_VERSION: ${{ env.VERSION }}
        run: python3 ipad/build.py
      - name: Installer sur l'iPad
        run: python3 ipad/deploy.py --deb "ipad/build/bsidedesk_${VERSION}_iphoneos-arm.deb" --save --allow-offline
      - uses: actions/upload-artifact@v4
        with:
          name: ipad
          path: ipad/build/*.deb

  windows:
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Mono (compilateur C#) et NSIS (installateur Windows)
        run: sudo apt-get update -q && sudo apt-get install -y -q mono-devel nsis
      - name: Compiler bSideDesk.exe
        run: sh windows/build.sh
      - name: Tester la restauration des mises à jour
        run: |
          mcs -out:/tmp/bsidedesk-update-tests.exe windows/src/UpdateInstaller.cs windows/tests/UpdateInstallerTests.cs
          mono /tmp/bsidedesk-update-tests.exe
      - name: Tester les transferts interrompus
        run: |
          mcs -out:/tmp/bsidedesk-transfer-tests.exe windows/src/FileTransfer.cs windows/tests/FileTransferTests.cs
          mono /tmp/bsidedesk-transfer-tests.exe
      - name: Signer les exe (Azure Trusted Signing, si configuré)
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: sh windows/sign.sh windows/bSideDesk.exe windows/installer/bSideDeskInstall.exe
      - name: Emballer
        run: |
          echo "$VERSION" > windows/version.txt
          cd windows
          zip ../bSideDesk-Windows.zip bSideDesk.exe bSideDesk.vbs bSideDesk-App.ps1 bSideDesk.ico bSideDesk.png version.txt
      - name: Préparer l'installateur (ffmpeg)
        run: |
          cd windows/installer
          # ffmpeg (build GPL statique de BtbN : ddagrab, QSV, NVENC, x264)
          curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q -j -o ff.zip '*/bin/ffmpeg.exe' -d .
          unzip -q -j -o ff.zip '*/LICENSE.txt' -d . && mv LICENSE.txt ffmpeg-LICENCE.txt || echo "FFmpeg (GPL) - sources : https://ffmpeg.org et https://github.com/BtbN/FFmpeg-Builds" > ffmpeg-LICENCE.txt
          rm -f ff.zip
      - name: Construire bSideDesk-Setup.exe
        run: |
          cd windows/installer
          makensis -V3 -DVERSION="$VERSION" bSideDesk.nsi
          mv bSideDesk-Setup.exe ../../
      - name: Signer l'installateur (si configuré)
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: sh windows/sign.sh bSideDesk-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            bSideDesk-Windows.zip
            bSideDesk-Setup.exe

  linux:
    name: Debian (paquet .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire bsidedesk_${{ env.VERSION }}_all.deb
        run: sh linux/build-deb.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: linux/build/*.deb

  release:
    name: Publier
    needs: [ipad, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" --title "bSideDesk ${VERSION}" --generate-notes
